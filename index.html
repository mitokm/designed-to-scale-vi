    <script>
      // apply a saved dark theme before the first paint, so the page never flashes light
      try {
        if (JSON.parse(localStorage.getItem('sdt:theme')) === 'dark') document.documentElement.dataset.theme = 'dark';
      } catch (e) {}
      // The language: ?lang= in the link, else the one the reader picked, else the first of the
      // browser's languages the course speaks (es-MX → es, zh-TW → zh-Hant), else English.
      // A language found this way isn't stored, so a later choice from the menu still wins.
      // src/main.js (pickLang) reads the answer from data-start-lang.
      try {
        var LANGS = ["en","ar","de","el","es","fr","he","hi","id","it","ja","ko","nl","pl","pt","ru","tr","uk","vi","zh-Hans","zh-Hant"];
        var fromBrowser = function () {
          var prefs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'en'];
          for (var i = 0; i < prefs.length; i++) {
            var tag = String(prefs[i]).toLowerCase().replace(/_/g, '-');
            var base = tag.split('-')[0];
            var id =
              base === 'zh' ? (/-(hant|tw|hk|mo)(-|$)/.test(tag) ? 'zh-Hant' : 'zh-Hans')
              : base === 'yue' ? 'zh-Hant'
              : base === 'iw' ? 'he' // old codes some systems still send
              : base === 'in' ? 'id'
              : base;
            if (LANGS.indexOf(id) >= 0) return id;
          }
          return 'en';
        };
        var stored = null;
        try {
          stored = JSON.parse(localStorage.getItem('sdt:lang'));
        } catch (e) {}
        var lang = new URLSearchParams(location.search).get('lang') || stored || 'vi';
        document.documentElement.dataset.startLang = lang;
        // another language loads its words first: keep the page hidden until then (see boot() in src/main.js)
        if (lang !== 'en') {
          document.documentElement.dataset.langPending = '1';
          if (lang === 'ar' || lang === 'he') document.documentElement.dir = 'rtl';
        }
      } catch (e) {}
      // pick the layout before the first paint too (same rule as fitWindow in src/main.js)
      var w = innerWidth, h = innerHeight;
      document.documentElement.dataset.layout = w >= 1200 && h >= 560 ? 'desktop' : w >= 960 && h >= 600 ? 'tablet' : 'stack';
    </script>
